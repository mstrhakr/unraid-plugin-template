name: Commit Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # ============================================
  # Unit Tests - Test your plugin's PHP code
  # ============================================
  phpunit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    
    # Test against multiple PHP versions for compatibility
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch submodules (plugin-tests framework)
          submodules: recursive
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, json
          # Enable coverage on one PHP version only (faster CI)
          coverage: ${{ matrix.php-version == '8.2' && 'xdebug' || 'none' }}
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Run tests
        run: vendor/bin/phpunit --testdox
      
      # Optional: Upload coverage to a service like Codecov
      # - name: Upload coverage
      #   if: matrix.php-version == '8.2'
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: coverage/clover.xml

  # ============================================
  # Code Style - Enforce consistent formatting
  # ============================================
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP-CS-Fixer
        uses: docker://oskarstark/php-cs-fixer-ga
        with:
          args: --diff --dry-run

  # ============================================
  # Static Analysis - Catch bugs before runtime
  # ============================================
  phpstan:
    name: PHPStan Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: php-actions/composer@v6
      - uses: php-actions/phpstan@v3
        with:
          version: composer

  # ============================================
  # Commit Messages - Enforce conventional commits
  # ============================================
  commitlint:
    name: Commitlint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install commitlint
        run: |
          npm install -g commitlint
          npm install -g "@commitlint/config-conventional"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --from HEAD~1 --to HEAD --verbose

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose
